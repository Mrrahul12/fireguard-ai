server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  application:
    name: fireguard-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:fireguard}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:fireguard}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:fireguard}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
